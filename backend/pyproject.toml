[project]
name = "evallab"
version = "0.1.0"
description = "Control plane y worker del laboratorio de evaluación agéntica (M0: esqueletos)."
requires-python = "==3.14.7"
dependencies = [
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
]

[project.scripts]
evallab-api = "evallab.api.__main__:main"
evallab-worker = "evallab.worker.__main__:main"

[build-system]
requires = ["uv_build==0.12.20"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.uv]
required-version = "==0.12.20"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
