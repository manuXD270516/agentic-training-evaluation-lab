name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Sin secretos ni credenciales de modelos: ningún job los necesita.
env:
  OPENSPEC_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  openspec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spec:validate

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_DB: evallab
          POSTGRES_USER: evallab
          # Contenedor efímero del job, sólo accesible desde el runner; no es un secreto.
          POSTGRES_PASSWORD: ci-ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evallab -d evallab"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: evallab
      POSTGRES_USER: evallab
      POSTGRES_PASSWORD: ci-ephemeral
      EVALLAB_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter evallab-frontend run format:check
      - run: pnpm --filter evallab-frontend run typecheck
      - run: pnpm --filter evallab-frontend run build

  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generar .env efímero
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Salud de API y worker
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          docker compose exec -T worker python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3).read().decode())"
      - name: Esquema migrado en la base vacía
        run: |
          result=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) = 1 AND to_regclass('"'"'public.experiments'"'"') IS NOT NULL FROM alembic_version"')
          test "$result" = "t"
      - name: El worker no tiene salida de red
        run: |
          if docker compose exec -T worker python -c "import socket; socket.create_connection(('1.1.1.1', 443), timeout=3)"; then
            echo "El worker alcanzó Internet; la red debe estar denegada" >&2
            exit 1
          fi
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
