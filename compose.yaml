name: evallab

x-backend: &backend
  build: ./backend
  image: evallab-backend:local
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-evallab}
  POSTGRES_USER: ${POSTGRES_USER:-evallab}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env (ver .env.example)}

services:
  db:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evallab}
      POSTGRES_USER: ${POSTGRES_USER:-evallab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env (ver .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 usa PGDATA=/var/lib/postgresql/18/docker; se monta el directorio padre.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [edge, internal]

  migrate:
    <<: *backend
    command: ["evallab-migrate"]
    restart: "no"
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    <<: *backend
    command: ["evallab-api"]
    environment:
      <<: *db-env
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [edge, internal]

  worker:
    <<: *backend
    command: ["evallab-worker"]
    environment:
      <<: *db-env
      WORKER_HEALTH_HOST: 127.0.0.1
      WORKER_HEALTH_PORT: "8001"
      WORKER_AGENT_NETWORK: deny
      WORKER_AGENT_HOST_TOOLS: "false"
    # Sin puertos publicados, sin volúmenes del host ni socket de Docker: el host no es una
    # herramienta del agente. Sólo la red `internal` (sin salida a Internet).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [internal]

networks:
  edge: {}
  internal:
    internal: true

volumes:
  pgdata: {}
