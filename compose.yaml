name: evallab

x-backend: &backend
  build: ./backend
  image: evallab-backend:local
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

x-otel-env: &otel-env
  # Vacío = telemetría desactivada. Con el perfil `otel`: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-evallab}
  POSTGRES_USER: ${POSTGRES_USER:-evallab}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env (ver .env.example)}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evallab}
      POSTGRES_USER: ${POSTGRES_USER:-evallab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env (ver .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 usa PGDATA=/var/lib/postgresql/18/docker; se monta el directorio padre.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [edge, internal]

  migrate:
    <<: *backend
    command: ["evallab-migrate"]
    restart: "no"
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    <<: *backend
    command: ["evallab-api"]
    environment:
      <<: [*db-env, *otel-env]
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [edge, internal]

  worker:
    <<: *backend
    command: ["evallab-worker"]
    environment:
      <<: [*db-env, *otel-env]
      WORKER_HEALTH_HOST: 127.0.0.1
      WORKER_HEALTH_PORT: "8001"
      WORKER_AGENT_NETWORK: deny
      WORKER_AGENT_HOST_TOOLS: "false"
    # Sin puertos publicados, sin volúmenes del host ni socket de Docker: el host no es una
    # herramienta del agente. Sólo la red `internal` (sin salida a Internet).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [internal]

  otel-collector:
    # Opcional: `docker compose --profile otel up`. Sólo red interna, sin puertos publicados.
    profiles: [otel]
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

networks:
  edge: {}
  internal:
    internal: true

volumes:
  pgdata: {}
