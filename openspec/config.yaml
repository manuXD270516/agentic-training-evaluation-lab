schema: spec-driven

context: |
  Proyecto: agentic-training-evaluation-lab. Documentación en español.
  Laboratorio de evaluación reproducible de agentes; no chatbot.
  Estado: M0 y tareas 2.1-2.2 implementados; 2.3 en adelante pendiente. Toolchain en design.md §9.
  Arquitectura propuesta: FastAPI, React, PostgreSQL, OpenTelemetry.
  PGVector sólo para benchmark retrieval; MCP opcional y diferido.
  Evaluación determinística primero; judge auxiliar y explícitamente limitado.
  No confundir datos sintéticos, objetivos ni fixtures con resultados medidos.
  Flujo: proposal -> specs + design -> tasks -> implementación -> verificación -> archive.
rules:
  specs:
    - Usar requisitos SHALL y escenarios WHEN/THEN con casos negativos.
    - Definir denominadores, datos ausentes, versionado y evidencia observable.
  design:
    - Separar configuración del agente, oráculos privados y ejecución aislada.
    - Explicitar reproducibilidad limitada de proveedores remotos.
  tasks:
    - Cada tarea debe referenciar capability y evidencia de verificación.

